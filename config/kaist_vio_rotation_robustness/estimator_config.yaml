%YAML:1.0

# Dedicated TurnSafe KAIST-VIO baseline. The launch file repeats the frozen
# method fields as ROS parameters so ordinary ROS-over-YAML precedence cannot
# select a different estimator contract.
verbosity: "INFO"

use_fej: true
integration: "rk4"
use_stereo: true
max_cameras: 2

# Camera intrinsics, extrinsics, and camera-to-IMU time offset are fixed.
calib_cam_extrinsics: false
calib_cam_intrinsics: false
calib_cam_timeoffset: false
calib_imu_intrinsics: false
calib_imu_g_sensitivity: false

max_clones: 11
max_slam: 50
max_slam_in_update: 25
max_msckf_in_update: 50
dt_slam_delay: 1

# Development-only, fail-closed recovery contract for a post-initialization
# camera outage. These values are frozen in
# docs/icra27/ROTATION_OUTAGE_ROBUSTNESS_PLAN.md and the executable rejects any
# enabled configuration that changes them.
long_gap_recovery_enabled: true
long_gap_recovery_threshold: 0.5
long_gap_recovery_max_attempts: 10
long_gap_recovery_min_correspondences: 12
long_gap_recovery_min_inliers: 12
long_gap_recovery_min_inlier_ratio: 0.70
long_gap_recovery_reprojection_px: 2.0
long_gap_recovery_min_image_span_ratio: 0.25
long_gap_recovery_max_imu_angle_deg: 5.0
long_gap_recovery_consensus_frames: 3
long_gap_recovery_stationary_radius_m: 0.10
long_gap_recovery_orientation_sigma_deg: 2.0
long_gap_recovery_position_sigma_m: 0.10
long_gap_recovery_velocity_sigma_mps: 0.05

# Exact g_norm from the official KAIST-VIO VINS-Fusion configuration.
gravity_mag: 9.805

# Schur validation requires the MSCKF nuisance landmark in GLOBAL_3D.
feat_rep_msckf: "GLOBAL_3D"
feat_rep_slam: "ANCHORED_MSCKF_INVERSE_DEPTH"
feat_rep_aruco: "ANCHORED_MSCKF_INVERSE_DEPTH"

try_zupt: false
zupt_chi2_multipler: 0
zupt_max_velocity: 0.02
zupt_noise_multiplier: 10
zupt_max_disparity: 0.20
zupt_only_at_beginning: false

init_window_time: 2.0
init_imu_thresh: 0.60
init_max_disparity: 5.0
init_max_features: 50

init_dyn_use: false
init_dyn_mle_opt_calib: false
init_dyn_mle_max_iter: 50
init_dyn_mle_max_time: 0.05
init_dyn_mle_max_threads: 6
init_dyn_num_pose: 6
init_dyn_min_deg: 5.0

init_dyn_inflation_ori: 10
init_dyn_inflation_vel: 100
init_dyn_inflation_bg: 10
init_dyn_inflation_ba: 100
init_dyn_min_rec_cond: 1e-15

init_dyn_bias_g: [0.0, 0.0, 0.0]
init_dyn_bias_a: [0.0, 0.0, 0.0]

# Paths below are inert defaults. project/kaist_vio_serial.launch requires and
# overrides all three runtime evidence paths.
record_timing_information: false
record_timing_filepath: "/tmp/turnsafe_kaist_vio_timing.txt"
save_total_state: false
filepath_est: "/tmp/turnsafe_kaist_vio_state.txt"
filepath_std: "/tmp/turnsafe_kaist_vio_state_std.txt"

use_klt: true
num_pts: 200
fast_threshold: 30
grid_x: 5
grid_y: 5
min_px_dist: 15
knn_ratio: 0.70
track_frequency: 31.0
downsample_cameras: false
num_opencv_threads: 0
multi_threading_pubs: false
multi_threading_subs: false
histogram_method: "HISTOGRAM"

fi_max_dist: 10.0
fi_max_baseline: 200
fi_max_cond_number: 25000

use_aruco: false
num_aruco: 1024
downsize_aruco: true

up_msckf_sigma_px: 1.2
up_msckf_chi2_multipler: 1
up_msckf_landmark_elimination: "schur"
up_msckf_max_visual_passes: 1
up_slam_sigma_px: 1.2
up_slam_chi2_multipler: 1
up_aruco_sigma_px: 1
up_aruco_chi2_multipler: 1

use_mask: false

relative_config_imu: "kalibr_imu_chain.yaml"
relative_config_imucam: "kalibr_imucam_chain.yaml"
