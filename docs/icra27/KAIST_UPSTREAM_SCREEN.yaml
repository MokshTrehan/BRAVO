  scored_capture_trajectory_identity: byte_exact
  render_alignment: >-
    Fit one evo-1.31.1 SE(3)-without-scale transform from the capture estimate
    to associated GT (10 ms), then apply that identical transform to the
    rendered estimate and every rendered feature point. Raw PLY coordinates
    remain unaligned and authoritative.
  final_slam_policy: >-
    Save the literal final points_slam message. A zero-point final state is a
    valid zero-vertex PLY plus an explicit feature-collapse flag; never replace
    it with the last nonempty cloud.
  required_outputs:
    - geometry/feature_stream.bag
    - geometry/slam_landmarks_final.ply
    - geometry/msckf_update_points.ply
    - geometry/alignment_associations.csv
    - geometry/snapshots/25.ply
    - geometry/snapshots/50.ply
    - geometry/snapshots/75.ply
    - geometry/snapshots/max_angular_rate.ply
    - figures/top.svg
    - figures/side.svg
    - figures/oblique.svg
  terminology:
    points_slam: current_active_sparse_slam_state_not_persistent_map
    points_msckf: transient_last_update_points_aggregated_over_time
  missing_output_policy: explicit_failure_tile_never_fabricate

