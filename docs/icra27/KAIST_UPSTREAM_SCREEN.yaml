gate:
  outcomes:
    - ADVANCE_COMPLETION
    - ADVANCE_ACCURACY
    - PARITY
    - COMPLETION_SIGNAL_ONLY
    - INCONCLUSIVE_SHARED_FAILURE
    - STOP_AND_AUDIT
  advance_completion_requires:
    s1_complete_count: 11
    u0_complete_s1_incomplete_count: 0
    u0_incomplete_minimum: 1
    noninferiority: pass
  advance_accuracy_requires:
    s1_complete_count: 11
    u0_complete_count: 11
    noninferiority: pass
    materially_improved_metric_medians_minimum: 2
    regressed_metric_medians: 0
  stop_conditions:
    - any U0-complete and S1-incomplete sequence
    - provisional noninferiority failure
    - source, binary, config, calibration, or bag identity drift
    - missing scheduled attempt, pairing census, or geometry accounting
    - unreconciled catastrophic qualitative artifact
  ordered_fallbacks:
    completion_signal_only: >-
      Fewer than eight common COMPLETE sequences, no U0-complete/S1-incomplete
      cell, and no provenance/input validity failure. Report completion only;
      provisional accuracy is unassessable.
    inconclusive_shared_failure: >-
      Every valid result pattern not assigned above, including eight or more
      common COMPLETE sequences with passing noninferiority but one or both
      systems below 11/11. This does not authorize a superiority claim.
