  teardown_exception_rule: >-
    A pinned upstream class_loader unload abort after final visualization and
    complete valid output is retained as COMPLETE_WITH_TEARDOWN_DEFECT, counts
    as complete for accuracy, and cannot alone create a completion advantage.
  complete_requires:
