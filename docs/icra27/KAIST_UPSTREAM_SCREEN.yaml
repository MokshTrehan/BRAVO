    - initialization occurs within the first 10 percent of selected-input span
    - no reset, nonfinite state, covariance failure, or intervention
    - trajectory is eligible for the post-pair common-population evaluator
  tail_gap_max_seconds: 0.10
  negative_tail_tolerance_seconds: 0.01
  post_initialization_max_state_gap_seconds: 0.20
  initialization_delay_max_fraction_of_selected_input: 0.10

