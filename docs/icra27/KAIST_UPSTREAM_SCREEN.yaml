    - u0_record_skew_median_ns
    - u0_record_skew_p95_ns
    - u0_record_skew_max_ns
    - s1_exact_pair_count
    - s1_queued_pair_count
    - s1_processed_pair_count
    - s1_frequency_thinned_pair_count
    - s1_pending_pair_count
    - pair_set_intersection_count
    - u0_only_pair_count
    - s1_only_pair_count
    - u0_first_selected_header_stamp_ns
    - u0_last_selected_header_stamp_ns
    - s1_first_selected_header_stamp_ns
    - s1_last_selected_header_stamp_ns
    - estimator_output_first_timestamp_ns
    - estimator_output_last_timestamp_ns
  field_semantics:
    u0_native_skipped_count: >-
      Camera outer-loop visits that reach upstream's no-pair skip branch; this
      is not the larger count of visits that dispatch no callback because
      already-used candidates are skipped separately.
    u0_native_non_dispatch_camera_visit_count: >-
      All camera outer-loop visits that dispatch no callback, including both
      already-used candidates and no-pair skips.
    u0_reused_candidate_count: >-
      Opposite-camera candidates selected by more than one upstream anchor;
      this preserves the pinned source's used-index semantics.
    selected_header_stamps: >-
      The U0 fields bound the first and last native record-time-selected stereo
      callbacks; the S1 fields bound the first and last exact-header pairs
      before S1's frozen frequency thinning. They are static input-census
      fields, not estimator-output timestamps.
    estimator_output_timestamps: >-
      First and last sensor timestamps actually written to the estimator state
      output. They are populated from the attempt, not inferred from the bag.

